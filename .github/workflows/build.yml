name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ hashFiles('CMakeLists.txt') }}

      # Native arm64 only in CI to halve build time; Release packaging builds universal
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ./build/CLIPTests_artefacts/Release/CLIPTests

      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --skip-gui-tests \
            --validate build/CLIP_artefacts/Release/VST3/CLIP.vst3

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/CLIP_artefacts/Release/AU/CLIP.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Clip Gplg
