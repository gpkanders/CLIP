name: Build

# Windows runs on pushes to main and PRs. macOS is manual only to save Actions minutes (billed at 10x on private repos):
# Actions tab > Build > Run workflow
# Pushing a version tag also publishes the Windows zip as a GitHub Release: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ hashFiles('CMakeLists.txt') }}

      # Native arm64 only in CI to halve build time; Release packaging builds universal
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ./build/CLIPTests_artefacts/Release/CLIPTests

      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --skip-gui-tests \
            --validate build/CLIP_artefacts/Release/VST3/CLIP.vst3

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/CLIP_artefacts/Release/AU/CLIP.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Clip Gplg

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-windows-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release -j

      - name: Unit tests
        run: ./build/CLIPTests_artefacts/Release/CLIPTests.exe

      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x -y pluginval.zip > /dev/null
          ./pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests \
            --validate build/CLIP_artefacts/Release/VST3/CLIP.vst3

      - name: Package
        run: |
          version=$(sed -n 's/^project(CLIP VERSION \(.*\))$/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the CMake version $version"; exit 1
          fi
          name=CLIP-$version-Windows
          mkdir "$name"
          cp -R build/CLIP_artefacts/Release/VST3/CLIP.vst3 build/CLIP_artefacts/Release/Standalone/CLIP.exe "$name/"
          cp Packaging/INSTALL-Windows.txt "$name/INSTALL.txt"
          7z a "$name.zip" "$name" > /dev/null
          sha256sum "$name.zip" > "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: CLIP-*-Windows.zip*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows

      - uses: softprops/action-gh-release@v2
        with:
          files: CLIP-*-Windows.zip*
